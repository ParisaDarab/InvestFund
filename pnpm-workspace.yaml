packages:
  - apps/*
  - packages/*
  - infra/mocks/*
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: false
  # MSW (P0-WEB-04): its postinstall only copies the worker script into a configured directory; the
  # worker is generated on demand instead (apps/web README, "API mocking").
  msw: false
  # Prisma (P0-DB-01): downloads the query/schema engines and generates the client on install.
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
overrides:
  # GHSA-ggr8-5vv4-36mx (high): prisma 6.19.3 pulls deepmerge-ts 7.x via @prisma/config (dev only).
  # Remove once a Prisma release depends on deepmerge-ts >= 8.
  deepmerge-ts: 8.0.2
