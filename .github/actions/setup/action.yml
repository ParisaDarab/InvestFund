# Shared CI setup (P0-CI-01): pnpm from the root `packageManager` field, Node from `.nvmrc`,
# the pnpm store cached by actions/setup-node, then a frozen-lockfile install. The install also
# builds packages/shared (`prepare`) and generates the Prisma client (apps/api `postinstall`).
# Third-party actions are pinned to full commit SHAs; the comment names the release.
name: Setup workspace
description: Install pnpm and Node.js, restore the pnpm store cache and install dependencies.
runs:
  using: composite
  steps:
    - name: Install pnpm (version from package.json packageManager)
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Set up Node.js (version from .nvmrc) with pnpm store cache
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
